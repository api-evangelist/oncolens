aid: oncolens
name: OncoLens
description: 'OncoLens is an Atlanta, Georgia based AI-enabled digital healthcare platform
  for oncology, delivering workflow and analytics software to cancer programs and life
  science organizations. The platform extracts structured insight from unstructured clinical,
  pathology and laboratory data in the EMR to power multidisciplinary tumor board and case
  conference workflow, cancer registry abstraction and casefinding automation, accreditation
  and quality-metric reporting (CoC, NAPBC, NAPRC, ASCO QOPI), biomarker and precision-medicine
  tracking, real-world data analytics, and AI-assisted clinical trial matching and patient
  identification. Through the OncoLens Research Network it connects cancer centers with
  pharmaceutical and biotech sponsors for real-world data, quality improvement and
  industry-sponsored trial initiatives. OncoLens reports 220+ cancer centers, 45,000+
  multidisciplinary physicians and 5M+ oncology patients under care on the platform. The
  product is delivered as a customer-facing SaaS application behind an Auth0-backed single
  sign-on; OncoLens publishes no public developer portal, API reference, or machine-readable
  API contract.'
