name: OncoLens standards conformance
description: >-
  What OncoLens can be shown to conform to, separated strictly by evidence class. The
  identity and transport standards below are demonstrated by a machine-readable document the
  company serves anonymously. SOC 2 and HIPAA are published compliance entries on the
  company's own SafeBase trust center. The oncology coding standards are prose claims on
  marketing pages describing data the platform processes — none of them is declared inside a
  published contract, because OncoLens publishes no API contract at all.
regulatory_regime: health
regulatory_regime_note: >-
  OncoLens processes protected health information from EMRs on behalf of US cancer programs,
  which places it inside the HIPAA / 21st Century Cures Act regime. It publishes no FHIR
  CapabilityStatement, no US Core / USCDI declaration, no SMART on FHIR configuration and no
  Bulk Data endpoint — the health-sector domain-standard surface is entirely absent from its
  public footprint.
entries:
- id: oidc
  label: OpenID Connect Discovery 1.0
  conforms: true
  evidence:
    type: machine-readable
    url: https://login.oncolens.com/.well-known/openid-configuration
    http_status: 200
    detail: >-
      Complete OIDC Discovery document served anonymously on the company's own domain:
      issuer, authorization/token/userinfo/jwks endpoints, 14 scopes_supported, standard
      claims_supported, response_types_supported and id_token signing algorithms.
- id: oauth2
  label: OAuth 2.0 Authorization Server Metadata (RFC 8414)
  conforms: true
  evidence:
