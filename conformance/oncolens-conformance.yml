- id: soc2
  label: SOC 2
  conforms: claimed
  evidence:
    type: trust-center
    url: https://trust.oncolens.com/
    http_status: 200
    detail: >-
      A SOC 2 compliance entry is published at full maturity on the OncoLens SafeBase trust
